<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start page</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" v-cloak>
  <button class="icon-btn top-settings" :title="t('settings')" @click="settings.show=true" :aria-label="t('settings')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.78.55l-.05.07h-3.4l-.03-.08a1.7 1.7 0 0 0-1.52-1.1 1.7 1.7 0 0 0-1.52 1.1l-.03.08H6.29l-.05-.07a1.7 1.7 0 0 0-1.78-.55l-.08.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 3.08 15l-.08-.04v-3.4l.08-.04a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-2.94.08.02a1.7 1.7 0 0 0 1.78-.55l.05-.07h3.4l.03.08a1.7 1.7 0 0 0 1.52 1.1 1.7 1.7 0 0 0 1.52-1.1l.03-.08h3.4l.05.07a1.7 1.7 0 0 0 1.78.55l.08-.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 11.5l.08.04v3.4l-.08.06Z"/></svg></button>
  <button class="icon-btn top-add" :title="t('addBookmark')" @click="openBm">+</button>

  <!-- 1. Search -->
  <section class="search">
    <h1>{{t('searchTitle')}}</h1>
    <div class="search-box">
      <button class="engine-btn" :title="engine.name" @click="menu=!menu"><img :src="icon(engine.host)" alt=""><span>▾</span></button>
      <input v-model="q" @input="onInput" @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.enter="go"
             :placeholder="t('search')+': '+engine.name" autofocus autocomplete="off" spellcheck="false">
      <ul class="menu engines" v-if="menu">
        <li v-for="(e,i) in engines" :key="e.name" :class="{on:i===state.engine}" @click="state.engine=i;menu=false"><img :src="icon(e.host)" alt="">{{e.name}}</li>
      </ul>
      <ul class="menu" v-if="sugg.length">
        <li v-for="(s,i) in sugg" :key="s" :class="{on:i===sel}" @mousedown.prevent="q=s;go()">{{s}}</li>
      </ul>
    </div>
  </section>

  <!-- 2. Bookmarks grid -->
  <section class="grid">
    <a class="tile" v-for="b in state.bookmarks" :key="b.id" :href="b.url" draggable="true" v-bind="dnd('bookmarks',state.bookmarks,b.id)">
      <div class="ic"><img v-if="!b.bad" :src="icon(b.host)" alt="" @error="b.bad=true"><b v-else>{{b.title[0]}}</b></div>
      <span>{{b.title}}</span>
      <button class="x" :title="t('delete')" @click.prevent="delBm(b.id)">×</button>
    </a>
  </section>

  <!-- 3. Widgets (only this part scrolls) -->
  <section class="widgets">
    <div class="wrow" v-for="w in state.widgets" :key="w.id" v-bind="dnd('widgets',state.widgets,w.id)">
      <span class="handle" draggable="true" :title="t('drag')">⠿</span>
      <div class="widget" v-if="!w.hidden">
        <component :is="loaded[w.type]" v-if="loaded[w.type]" :config="w.config"></component>
        <div v-else class="skeleton"></div>
      </div>
      <button class="icon-btn" v-if="!w.hidden" :title="t('hide')" @click="w.hidden=true">−</button>
      <div class="widget-hidden" v-else>
        <div><b>{{wt(w.type,'name')}}</b><small>{{meta[w.type].summary(w.config)}}</small></div>
        <button class="btn" @click="w.hidden=false">{{t('show')}}</button>
        <button class="btn danger" @click="delW(w.id)">{{t('delete')}}</button>
      </div>
    </div>
    <div class="wadd"><button class="icon-btn" :title="t('addWidget')" @click="openWm">+</button></div>
  </section>

  <!-- Settings modal -->
  <div class="backdrop" v-if="settings.show" @mousedown.self="settings.show=false">
    <form class="modal" @submit.prevent="settings.show=false">
      <h2>{{t('settings')}}</h2>
      <label>{{t('language')}}
        <select class="language-select" :value="state.lang" @change="setLang($event.target.value)">
          <option v-for="l in langs" :key="l.code" :value="l.code">{{l.name}}</option>
        </select>
      </label>
      <div class="actions"><button class="btn primary">{{t('done')}}</button></div>
    </form>
  </div>

  <!-- Bookmark modal -->
  <div class="backdrop" v-if="bm.show" @mousedown.self="bm.show=false">
    <form class="modal" @submit.prevent="addBookmark">
      <h2>{{t('newBookmark')}}</h2>
      <label>{{t('url')}}<input v-model="bm.url" v-focus placeholder="example.com" required></label>
      <label>{{t('name')}} <small>{{t('optionalTitle')}}</small><input v-model="bm.title"></label>
      <div class="actions"><button type="button" class="btn" @click="bm.show=false">{{t('cancel')}}</button><button class="btn primary">{{t('add')}}</button></div>
    </form>
  </div>

  <!-- Widget modal -->
  <div class="backdrop" v-if="wm.show" @mousedown.self="wm.show=false">
    <form class="modal" @submit.prevent="addWidget">
      <h2>{{t('newWidget')}}</h2>
      <div class="choices">
        <button type="button" v-for="c in catalog" :key="c.type" class="choice" :class="{on:wm.type===c.type}" @click="wm.type=c.type;wm.config={}"><b>{{c.name}}</b><small>{{c.description}}</small></button>
      </div>
      <label v-for="f in wfields" :key="wm.type+f.key">{{f.label}}<input v-model="wm.config[f.key]" v-focus :placeholder="f.placeholder" :required="f.required"></label>
      <div class="actions"><button type="button" class="btn" @click="wm.show=false">{{t('cancel')}}</button><button class="btn primary">{{t('add')}}</button></div>
    </form>
  </div>
</div>

<!-- Pinned CDN build; for offline use download it into js/ and change the src -->
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="js/store.js"></script>
<script src="js/i18n.js"></script>
<script src="js/locales/index.js"></script>
<script src="js/widgets/registry.js"></script>
<script src="js/app.js"></script>
</body>
</html>
